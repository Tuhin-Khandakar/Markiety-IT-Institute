<!DOCTYPE html><html lang="bn"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Server Error - মার্কিটি আইটি ইনস্টিটিউট</title>
  <meta name="description" content="Something went wrong. Please try again later.">
  <link rel="canonical" href="https://markietyitinstitute.netlify.app/500.html">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #4F7CFF;
      --primary-dark: #3b6ae8;
      --text: #1e293b;
      --bg: #f8fafc;
    }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .error-container { max-width: 500px; text-align: center; }
    .error-code { font-size: 8rem; font-weight: 700; color: var(--primary); line-height: 1; margin-bottom: 1rem; }
    .error-title { font-family: 'Poppins', sans-serif; font-size: 1.75rem; font-weight: 600; margin-bottom: 0.75rem; }
    .error-message { color: #64748b; margin-bottom: 2rem; line-height: 1.6; }
    .btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.875rem 1.75rem; background: var(--primary); color: white; text-decoration: none; border-radius: 8px; font-weight: 500; transition: background 0.2s; }
    .btn:hover { background: var(--primary-dark); }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-code">৫00</div>
    <h1 class="error-title">Server Error</h1>
    <p class="error-message">Sorry, something went wrong on our end. Please try refreshing the page or come back shortly.</p>
    <a href="index-bn.html" class="btn">← Try Again</a>
  </div>


</body></html>
