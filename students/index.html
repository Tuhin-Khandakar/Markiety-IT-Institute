<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#4F7CFF" />
  <title>MIT Student Portal — Login</title>
  <meta name="description"
    content="Access your Markiety IT Institute student dashboard to view course materials, homework, and updates." />
  <link rel="icon" type="image/jpeg" href="/assets/logo.jpg" />
  <link rel="shortcut icon" href="/assets/logo.jpg" />
  <link rel="apple-touch-icon" href="/assets/logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/advanced-features.css" />
  <link rel="stylesheet" href="../css/mobile.css" />
</head>

<body data-theme="dark" data-page="student-login">
  <main class="section">
    <div class="container" style="max-width:440px">
      <article class="card login-card">
        <!-- Logo -->
        <div class="login-logo">
          <img src="../assets/logo.jpg" alt="MIT Logo" width="64" height="64" />
        </div>

        <h1>🎓 Student Portal</h1>
        <p class="muted">Welcome back! Please sign in with your admission credentials.</p>

        <form id="studentLoginForm" class="form-grid compact">
          <div class="form-field span-2">
            <label for="loginTracking">🎫 Tracking Number</label>
            <input id="loginTracking" type="text" inputmode="text" placeholder="MIT-0001" required />
            <small class="muted">Your tracking number from the invoice</small>
          </div>
          <div class="form-field span-2">
            <label for="loginPin">🔐 Portal PIN</label>
            <input id="loginPin" type="password" maxlength="6" placeholder="••••" required />
            <small class="muted">Your 4-digit PIN from the invoice</small>
          </div>
          <div class="form-actions span-2">
            <button type="submit" class="btn btn-gradient btn-full" id="loginBtn">🚀 Sign In</button>
            <p id="studentLoginMessage" class="muted small" role="status"></p>
          </div>
        </form>

        <div class="login-help">
          <p class="small muted">Forgot your PIN? Visit the MIT office or call <a href="tel:+8801624547667">+880
              1624-547667</a></p>
          <p class="small muted">Email: <a id="contactEmailLink"
              href="mailto:markietyitinstitute@gmail.com">markietyitinstitute@gmail.com</a></p>
        </div>

        <div class="login-footer">
          <a href="../index.html" class="muted small">← Back to Website</a>
        </div>
      </article>
    </div>
  </main>
  <!-- Supabase Integration -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/services/supabase-service.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/app.js" defer></script>
</body>

</html>
