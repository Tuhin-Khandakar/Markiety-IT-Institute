# No catch-all needed - this is a multi-page site, not an SPA

# PipraPay-style Payment API Functions
[[redirects]]
  from = "/api/payment/create"
  to = "/.netlify/functions/create-payment"
  status = 200
  force = true

[[redirects]]
  from = "/api/payment/verify"
  to = "/.netlify/functions/verify-payment"
  status = 200
  force = true

[[redirects]]
  from = "/api/payment/bkash"
