<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MIT Admin Login</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/jpeg" href="/assets/logo.jpg" />
  <link rel="shortcut icon" href="/assets/logo.jpg" />
  <link rel="apple-touch-icon" href="/assets/logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/advanced-features.css" />
  <link rel="stylesheet" href="../css/mobile.css" />
</head>

<body data-theme="light" data-page="admin-login">
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="../index.html">
        <img src="../assets/logo.jpg" alt="MIT logo" class="logo" width="44" height="44" />
        <div class="brand-copy">
          <span class="brand-name">MIT Admin</span>
          <span class="brand-tagline">Secure Access</span>
        </div>
      </a>
      <div class="header-actions">
        <button type="button" class="icon-btn" id="themeToggle" aria-label="Toggle color theme">
          <span class="icon-sun" aria-hidden="true"></span>
          <span class="icon-moon" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container" style="max-width:520px">
      <div class="card">
        <h1>Admin Login</h1>

        <form id="adminLoginForm" class="form-grid">
          <div class="form-field span-2">
            <label for="adminEmail">Email</label>
            <input id="adminEmail" name="email" type="email" autocomplete="username" required />
          </div>
          <div class="form-field span-2">
            <label for="adminPassword">Password</label>
            <input id="adminPassword" name="password" type="password" autocomplete="current-password" required />
          </div>
          <div class="form-actions span-2">
            <button type="submit" class="btn btn-gradient">Log In</button>
            <p id="adminLoginStatus" class="muted small" role="status"></p>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/services/supabase-service.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/app.js" defer></script>
</body>

</html>
